# Pre-commit hooks for TypeScript/JavaScript projects
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-added-large-files
        args: ['--maxkb=1000']

  # ESLint - local hook using project's eslint
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        types: [javascript, jsx, ts, tsx]
        require_serial: false

  # Prettier - local hook using project's prettier
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
        require_serial: false

  # Gitleaks - secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # YAML linting for GitHub Actions
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        # comments.min-spaces-from-content is 1, not yamllint's default of 2,
        # and truthy.check-keys is off. Both exist to stop yamllint fighting the
        # prettier hook three entries above it, which is a deadlock rather than a
        # style disagreement: prettier --write rewrites `sha  # v7` to `sha # v7`,
        # yamllint --strict then fails "too few spaces before comment", and since
        # prettier has already modified the file the commit aborts. Re-running
        # does not help, because prettier re-applies the same change every time.
        # Net effect before this fix: NO workflow file in this repo could be
        # edited and committed through the hooks at all. truthy.check-keys is the
        # standard GitHub Actions accommodation, since `on:` is a real key there.
        args:
          - --strict
          - -d
          - "{extends: default, rules: {line-length: {max: 120}, document-start: disable,\
            \ comments: {min-spaces-from-content: 1}, truthy: {check-keys: false}}}"
        files: \.github/workflows/.*\.ya?ml$

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml]
