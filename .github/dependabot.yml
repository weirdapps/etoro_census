version: 2
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "npm"
    groups:
      # Group React ecosystem together (must be updated together)
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Group Vitest ecosystem together (must be updated together)
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Group all other minor and patch updates together
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "vitest"
          - "@vitest/*"
    # Ignore major versions that break ecosystem compatibility
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESLint 10 not yet supported by eslint-plugin-react, eslint-config-next, etc.
      # Remove this ignore once ecosystem catches up (check eslint-plugin-react peerDeps)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Group all action updates together
      actions:
        patterns:
          - "*"
