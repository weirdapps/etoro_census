name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Minimal token scope. Added 2026-09-20: this workflow had no
# permissions: key, so GITHUB_TOKEN arrived with the repository default,
# which on these repos is write across contents, issues, pull-requests and
# more. Nothing here writes anything; it checks out and runs checks.
permissions:
  contents: read

jobs:
  test:
    name: Test, Lint & Build
    runs-on: ubuntu-latest

    steps:
      # No fetch-depth here on purpose. This job runs install/lint/typecheck/
      # test/build and no Sonar step, so it needs no history. The old
      # `fetch-depth: 0  # Full history for SonarCloud` was a copy-paste leftover
      # from sonarcloud.yml, and on a 3.37 GiB repo it fetched EVERY branch,
      # including data-archive: measured 202s of a 269s job spent in git fetch
      # against 57s of actual work, roughly 8.5 runner-hours a month.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm test -- --coverage --reporter=verbose

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build application
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

      - name: Verify build output
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful"
            du -sh .next
          else
            echo "❌ Build failed - .next directory not found"
            exit 1
          fi
