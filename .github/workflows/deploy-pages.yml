name: Deploy to GitHub Pages

on:
  # Only trigger from daily census workflow or manual dispatch
  # Not from pushes (since dated files are in artifacts, not git)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large unnecessary packages to free up ~10GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          echo "Disk space after cleanup:"
          df -h

      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Checkout data-archive branch for historical files
        uses: actions/checkout@v4
        with:
          ref: data-archive
          path: archive

      - name: Copy archived files to public directories
        run: |
          mkdir -p public/data public/reports

          # Copy all historical data from archive branch
          echo "📦 Copying historical data from data-archive branch..."
          cp archive/data/*.json public/data/ 2>/dev/null || true
          cp archive/reports/*.html public/reports/ 2>/dev/null || true

          DATA_COUNT=$(ls public/data/*.json 2>/dev/null | wc -l)
          REPORT_COUNT=$(ls public/reports/*.html 2>/dev/null | wc -l)

          echo "✅ Copied $DATA_COUNT JSON data files"
          echo "✅ Copied $REPORT_COUNT HTML reports"

          if [ $REPORT_COUNT -eq 0 ]; then
            echo "⚠️  Warning: No reports found in archive branch"
            echo "   Run 'migrate-historical-data' workflow if this is first deployment"
          fi

      - name: Find and copy latest report as index.html
        run: |
          cd public/reports
          # Find the most recent report file by filename (excluding index.html)
          LATEST_REPORT=$(ls etoro-census-*.html 2>/dev/null | sort -r | head -n 1)
          if [ -n "$LATEST_REPORT" ]; then
            echo "Found latest report: $LATEST_REPORT"
            echo "Copying $LATEST_REPORT to public/index.html"
            cp "$LATEST_REPORT" ../index.html
            echo "Copying $LATEST_REPORT to root index.html"
            cp "$LATEST_REPORT" ../../index.html
            echo "Latest report: $LATEST_REPORT" > ../../latest-report.txt
            echo "✅ Successfully updated index.html files"
          else
            echo "No report files found"
            # Create a placeholder if no reports exist
            echo "<!DOCTYPE html><html><head><title>eToro Census</title></head><body><h1>No reports available yet</h1></body></html>" > ../index.html
            echo "<!DOCTYPE html><html><head><title>eToro Census</title></head><body><h1>No reports available yet</h1></body></html>" > ../../index.html
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Prepare deployment files
        run: |
          # Create deployment directory with only necessary files
          mkdir -p deploy-temp

          # Copy essential files for website
          cp index.html deploy-temp/

          # Copy only recent reports (last 7 days) to avoid disk space issues
          mkdir -p deploy-temp/reports
          echo "Copying reports from last 7 days only..."

          # Calculate cutoff date (7 days ago)
          CUTOFF_DATE=$(date -d "7 days ago" +%Y-%m-%d 2>/dev/null || date -v-7d +%Y-%m-%d)
          echo "Cutoff date: $CUTOFF_DATE"

          cd public/reports
          COPIED_COUNT=0
          for report in etoro-census-*.html; do
            if [ -f "$report" ]; then
              # Extract date from filename (format: etoro-census-2025-09-15-02-03.html)
              FILE_DATE=$(echo "$report" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
              if [ -n "$FILE_DATE" ] && [ "$FILE_DATE" \> "$CUTOFF_DATE" ] || [ "$FILE_DATE" = "$CUTOFF_DATE" ]; then
                cp "$report" ../../deploy-temp/reports/
                COPIED_COUNT=$((COPIED_COUNT + 1))
              fi
            fi
          done
          cd ../..
          echo "Copied $COPIED_COUNT recent reports to deployment"

          # Copy only the latest 7 data files for the dashboard
          mkdir -p deploy-temp/data
          cd public/data
          ls etoro-data-*.json 2>/dev/null | sort -r | head -n 7 | while read datafile; do
            if [ -n "$datafile" ]; then
              echo "Including data file: $datafile"
              cp "$datafile" ../../deploy-temp/data/
            fi
          done
          cd ../..

          echo "✅ Deployment files prepared with recent data only (keeping all local files intact)"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only necessary files for GitHub Pages
          path: 'deploy-temp'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4