name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  schedule:
    # Run at 00:30 UTC every day (30 min after census)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large unnecessary packages to free up ~10GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          echo "Disk space after cleanup:"
          df -h

      - name: Checkout main branch
        uses: actions/checkout@v6

      - name: Get recent files from data-archive branch
        run: |
          echo "📦 Fetching recent files from data-archive branch..."

          # Calculate cutoff date (7 days ago)
          CUTOFF_DATE=$(date -d "7 days ago" +%Y-%m-%d 2>/dev/null || date -v-7d +%Y-%m-%d)
          echo "Cutoff date for files: $CUTOFF_DATE"

          # Fetch only the data-archive branch metadata
          git fetch origin data-archive --depth=1

          # List files from data-archive without checking them out
          mkdir -p public/data public/reports

          # Get list of recent files directly from git
          echo "Getting list of recent files..."
          git ls-tree -r --name-only origin/data-archive > all-files.txt

          # Copy only recent report files (last 7 days)
          REPORT_COUNT=0
          while IFS= read -r file; do
            if [[ "$file" == reports/etoro-census-*.html ]]; then
              FILE_DATE=$(echo "$file" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
              if [ -n "$FILE_DATE" ] && [[ "$FILE_DATE" > "$CUTOFF_DATE" || "$FILE_DATE" == "$CUTOFF_DATE" ]]; then
                git show "origin/data-archive:$file" > "public/$file"
                REPORT_COUNT=$((REPORT_COUNT + 1))
                echo "  ✓ Retrieved: $file"
              fi
            fi
          done < all-files.txt

          # Copy only the latest 7 data files
          DATA_COUNT=0
          git ls-tree -r --name-only origin/data-archive | grep 'data/etoro-data-.*\.json' | sort -r | head -n 7 | while read file; do
            git show "origin/data-archive:$file" > "public/$file"
            DATA_COUNT=$((DATA_COUNT + 1))
            echo "  ✓ Retrieved: $file"
          done

          echo "✅ Retrieved $REPORT_COUNT recent reports and 7 latest data files"
          echo "💾 Disk space saved by not checking out all 209 files (23GB)"

      - name: Find and copy latest report as index.html
        run: |
          cd public/reports
          # Find the most recent report file by filename (excluding index.html)
          LATEST_REPORT=$(ls etoro-census-*.html 2>/dev/null | sort -r | head -n 1)
          if [ -n "$LATEST_REPORT" ]; then
            echo "Found latest report: $LATEST_REPORT"
            echo "Copying $LATEST_REPORT to public/index.html"
            cp "$LATEST_REPORT" ../index.html
            echo "Copying $LATEST_REPORT to root index.html"
            cp "$LATEST_REPORT" ../../index.html
            echo "Latest report: $LATEST_REPORT" > ../../latest-report.txt
            echo "✅ Successfully updated index.html files"
          else
            echo "No report files found"
            # Create a placeholder if no reports exist
            echo "<!DOCTYPE html><html><head><title>eToro Census</title></head><body><h1>No reports available yet</h1></body></html>" > ../index.html
            echo "<!DOCTYPE html><html><head><title>eToro Census</title></head><body><h1>No reports available yet</h1></body></html>" > ../../index.html
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Prepare deployment files
        run: |
          # Create deployment directory with only necessary files
          mkdir -p deploy-temp

          # Copy essential files for website
          cp index.html deploy-temp/

          # Copy the reports and data directories (already filtered to last 7 days)
          cp -r public/reports deploy-temp/ 2>/dev/null || mkdir -p deploy-temp/reports
          cp -r public/data deploy-temp/ 2>/dev/null || mkdir -p deploy-temp/data

          REPORT_COUNT=$(ls deploy-temp/reports/*.html 2>/dev/null | wc -l || echo 0)
          DATA_COUNT=$(ls deploy-temp/data/*.json 2>/dev/null | wc -l || echo 0)

          echo "✅ Deployment prepared: $REPORT_COUNT reports, $DATA_COUNT data files"
          echo "💾 Total size kept minimal (last 7 days only)"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload only necessary files for GitHub Pages
          path: 'deploy-temp'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4