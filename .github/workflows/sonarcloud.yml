name: SonarCloud Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

jobs:
  sonarcloud:
    if: ${{ !github.event.repository.private }}
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Full history for SonarCloud blame
          # Sonar genuinely needs the commit graph, but not the blobs. Partial
          # clone (checkout >= v4.2, this is v7) fetches all ~1,178 commits with
          # none of the file contents, which on a 3.37 GiB repo took the checkout
          # step from 227s of a 267s job down to seconds.
          filter: blob:none

      # Sonar's blame is jgit, and jgit does NOT speak the partial-clone
      # protocol: where native git would lazily fetch a missing blob, jgit dies
      # with "MissingObjectException: Missing blob <sha>" and the scan exits 3.
      # That is intermittent by nature, because it only fires when blame reaches
      # a blob the filter omitted, which is why runs on 2026-09-07 and
      # 2026-09-08 09:37 passed while 2026-09-08 03:51 and 23:32 failed.
      #
      # Rather than drop `filter: blob:none` (a full clone of this repo is
      # 3.41 GiB and took the checkout step from seconds back to 227s), backfill
      # only the blobs blame can actually ask for. `cat-file --batch` forces
      # native git to resolve them from the promisor remote, after which jgit
      # finds them locally.
      #
      # THE PATHSPEC IS DERIVED FROM sonar.exclusions, NOT HAND-WRITTEN. Blame
      # runs over every file Sonar INDEXED, and with `sonar.sources=.` that is
      # every tracked file the exclusion list does not match: 145 of them, not
      # only the TypeScript. The first version of this step listed
      # `src scripts *.ts *.js *.mjs *.cjs`, which omitted package.json among
      # others, and the 2026-09-10 20:53 scan died on a historical package.json
      # blob (343576d) with exactly the MissingObjectException this step exists
      # to prevent. Keep the excludes below in step with sonar-project.properties.
      #
      # Restricting to CURRENTLY TRACKED paths is what keeps it cheap: blame only
      # ever asks about files in the checked-out tree, while `--all -- <dir>`
      # would also drag in history-only paths. Measured on 2026-09-11: 742 blobs,
      # 53.8 MiB, versus 3.41 GiB for a full clone and 64.8 GiB for every blob in
      # history (the generated census HTML and JSON dominate it).
      - name: Backfill the blobs Sonar's blame needs
        run: |
          set -euo pipefail
          # -r matters: with no paths at all, xargs would otherwise run a bare
          # `git rev-list --objects --all --` and try to fetch all 64.8 GiB.
          blame_paths() {
            git ls-files -z -- . \
              ':(exclude)data' ':(exclude)public' ':(exclude)analysis' \
              ':(exclude)research' ':(exclude).github' \
              ':(exclude)supabase/migrations'
          }
          echo "tracked paths Sonar will blame: $(blame_paths | tr -cd '\0' | wc -c)"
          blame_paths \
            | xargs -0 -r git rev-list --objects --all -- \
            | awk '{print $1}' \
            | git cat-file --batch --buffer >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for test script
        id: check-tests
        run: |
          if [ -f package.json ] && jq -e '.scripts.test' package.json > /dev/null 2>&1; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "::notice::No test script in package.json — skipping coverage upload"
          fi

      - name: Run tests with coverage
        if: steps.check-tests.outputs.has_tests == 'true'
        run: npm test -- --coverage
        continue-on-error: true

      - name: Check for SonarCloud token
        id: check-sonar
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::SONAR_TOKEN not configured — skipping SonarCloud scan"
          fi

      - name: SonarCloud Scan
        if: steps.check-sonar.outputs.has_token == 'true'
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Fail if the server-side analysis failed
        # The scanner exits 0 the moment the report finishes uploading. Anything
        # that rejects the analysis afterwards happens in SonarCloud's Compute
        # Engine, which this job never looked at, so it went green while nothing
        # was measured. That is how weirdapps_plessas-lab stayed broken from
        # creation to 2026-08-29 with every run reporting success, and how the
        # free plan's 50,000-line org ceiling takes every repo down at once
        # without producing a single red build anywhere.
        if: steps.check-sonar.outputs.has_token == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          report=.scannerwork/report-task.txt
          if [ ! -f "$report" ]; then
            echo "::error::$report is missing, so the analysis cannot be confirmed"
            exit 1
          fi
          task_url=$(sed -n 's/^ceTaskUrl=//p' "$report")
          get() { python3 -c "import json,sys;print(json.load(sys.stdin)['task']$1)"; }
          for _ in $(seq 1 60); do
            body=$(curl -sS -u "${SONAR_TOKEN}:" "$task_url" || true)
            status=$(printf '%s' "$body" | get "['status']" 2>/dev/null || echo RETRY)
            case "$status" in
              SUCCESS)
                echo "Analysis completed server-side."
                exit 0
                ;;
              FAILED|CANCELED)
                msg=$(printf '%s' "$body" | get ".get('errorMessage','no message')")
                echo "::error::SonarCloud analysis $status: $msg"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::Timed out after 5 minutes waiting for the SonarCloud analysis task"
          exit 1
