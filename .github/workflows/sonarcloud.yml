name: SonarCloud Analysis

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Check if SonarCloud is configured
        id: check-sonar
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "⚠️ SONAR_TOKEN not configured - skipping SonarCloud analysis"
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "✅ SONAR_TOKEN found - proceeding with analysis"
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check-sonar.outputs.configured == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0  # Full history for accurate blame information

      - name: Setup Node.js
        if: steps.check-sonar.outputs.configured == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check-sonar.outputs.configured == 'true'
        run: npm ci

      - name: Run tests with coverage
        if: steps.check-sonar.outputs.configured == 'true'
        run: npm test -- --coverage

      - name: SonarCloud Scan
        if: steps.check-sonar.outputs.configured == 'true'
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
