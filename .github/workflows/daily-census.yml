name: Daily Census Report Generation

on:
  schedule:
    # Run at 00:00 UTC every day (midnight UTC)
    # This is 03:00 Athens time during summer (UTC+3)
    # and 02:00 Athens time during winter (UTC+2)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering
  # NOTE: do NOT add a `push` trigger here. The job commits to public/data,
  # which would re-trigger itself in an infinite loop (each run produced ~30
  # cancelled re-runs/day plus full CI/CodeQL/SonarCloud/Pages cycles). Use
  # workflow_dispatch for manual runs.

# Prevent multiple runs from overlapping - cancel in-progress run when new one starts
concurrency:
  group: daily-census
  cancel-in-progress: true

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write

    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large unnecessary packages to free up ~10GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          echo "Disk space after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.PUSH_PAT }}
          sparse-checkout: |
            src
            public/reports
            public/data
            .github
            analysis
            scripts
            package.json
            package-lock.json
            next.config.ts
            tsconfig.json
            postcss.config.mjs
            eslint.config.mjs
            components.json
          sparse-checkout-cone-mode: false
      
      - name: Create necessary directories
        run: |
          mkdir -p public/data
          echo "Created public/data directory for report storage"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create .env.local file
        run: |
          echo "ETORO_API_KEY=${{ secrets.ETORO_API_KEY }}" > .env.local
          echo "ETORO_USER_KEY=${{ secrets.ETORO_USER_KEY }}" >> .env.local
          # Verify the file was created
          echo "Created .env.local with:"
          wc -l .env.local
          
      - name: Build Next.js application
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          echo "Building with 6GB memory limit..."
          echo "Memory before build:"
          free -h
          npm run build
          echo "Memory after build:"
          free -h

      - name: Clean up build artifacts
        run: |
          echo "Cleaning up unnecessary files to save space..."
          # Remove Next.js cache (not needed for production server)
          rm -rf .next/cache
          echo "Disk space after build cleanup:"
          df -h

      - name: Start Next.js server
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          echo "Starting Next.js server with 6GB memory limit..."
          npm start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server to be ready with retry loop (max 60 seconds)
          echo "Waiting for server to be ready..."
          for i in {1..12}; do
            if curl -f -s http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Server is ready!"
              break
            fi
            if [ $i -eq 12 ]; then
              echo "❌ Server failed to start within 60 seconds"
              exit 1
            fi
            echo "Attempt $i/12: Server not ready yet, waiting 5 seconds..."
            sleep 5
          done
      
      - name: Generate census report
        run: |
          echo "🚀 Starting census report generation for 1500 investors..."
          echo "This process includes multiple phases:"
          echo "1. Data Collection: Fetching investors, portfolios, trade info, instruments, user details, and PI feeds"
          echo "2. Analysis: Generating insights for multiple investor bands"
          echo "3. Report Generation: Creating HTML and JSON outputs"
          echo ""

          # Call the optimized report endpoint with 1500 investors and PI feeds for briefings
          # Timeout: 150 minutes (9000 seconds) — collection + recovery pass + analysis + save
          curl -X POST http://localhost:3000/api/optimized-report \
            -H "Content-Type: application/json" \
            -d '{"period": "CurrYear", "maxInvestors": 1500, "includeFeeds": true}' \
            --max-time 9000 \
            --no-buffer \
            --silent \
            --show-error \
            --fail-with-body \
            -w "\n\nHTTP Status: %{http_code}\n" | while IFS= read -r line; do
              
              # Parse and display progress messages
              if echo "$line" | grep -q '"type":"progress"'; then
                PROGRESS=$(echo "$line" | sed -n 's/.*"progress":\([0-9]*\).*/\1/p')
                MESSAGE=$(echo "$line" | sed -n 's/.*"message":"\([^"]*\)".*/\1/p')
                
                # Highlight different phases
                if echo "$MESSAGE" | grep -q "trade info"; then
                  echo "📊 [$PROGRESS%] Trade Info Phase: $MESSAGE"
                elif echo "$MESSAGE" | grep -q "portfolio"; then
                  echo "💼 [$PROGRESS%] Portfolio Phase: $MESSAGE"
                elif echo "$MESSAGE" | grep -q "instrument"; then
                  echo "📈 [$PROGRESS%] Instrument Phase: $MESSAGE"
                elif echo "$MESSAGE" | grep -q "feed"; then
                  echo "💬 [$PROGRESS%] PI Feeds Phase: $MESSAGE"
                elif echo "$MESSAGE" | grep -q "analysis"; then
                  echo "🔍 [$PROGRESS%] Analysis Phase: $MESSAGE"
                else
                  echo "⏳ [$PROGRESS%] $MESSAGE"
                fi
                
              # Check if this is the complete event with the report URL
              elif echo "$line" | grep -q '"type":"complete"'; then
                # Extract the URLs from the JSON
                REPORT_URL=$(echo "$line" | sed -n 's/.*"reportUrl":"\([^"]*\)".*/\1/p')
                DATA_URL=$(echo "$line" | sed -n 's/.*"dataUrl":"\([^"]*\)".*/\1/p')
                echo ""
                echo "✅ Report generation complete!"
                echo "📄 Report generated at: $REPORT_URL"
                echo "💾 Data saved at: $DATA_URL"
                
              # Display errors
              elif echo "$line" | grep -q '"type":"error"'; then
                ERROR=$(echo "$line" | sed -n 's/.*"error":"\([^"]*\)".*/\1/p')
                echo "❌ Error: $ERROR"
              fi
            done
      
      - name: Validate census data was collected
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          DATA_FILE=$(ls public/data/etoro-data-${TODAY}-*.json 2>/dev/null | head -n 1)
          if [ -z "$DATA_FILE" ]; then
            echo "❌ FATAL: No data file created for ${TODAY}"
            echo "The eToro API likely returned empty data. Check API keys and rate limits."
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$DATA_FILE")
          MIN_SIZE=10000000
          if [ "$FILE_SIZE" -lt "$MIN_SIZE" ]; then
            echo "❌ FATAL: Data file too small ($(numfmt --to=iec $FILE_SIZE)), expected >$(numfmt --to=iec $MIN_SIZE)"
            echo "Partial sync detected — most investor portfolios are likely empty."
            echo "File: $DATA_FILE"
            exit 1
          fi
          echo "✅ Data file validated: $DATA_FILE ($(numfmt --to=iec $FILE_SIZE))"

          # Portfolio coverage check (informational — the gate is in the latest-copy step)
          COVERAGE_INFO=$(node -e "
            const data = JSON.parse(require('fs').readFileSync('$DATA_FILE', 'utf8'));
            const slice = data.investors.slice(0, 1500);
            const withPortfolio = slice.filter(i => i.portfolio?.positions?.length > 0).length;
            const coverage = (withPortfolio / slice.length * 100).toFixed(1);
            console.log(withPortfolio + '/' + slice.length + ' investors with portfolio data (' + coverage + '% coverage)');
          ")
          echo "📊 Coverage: $COVERAGE_INFO"

      - name: Stop Next.js server
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"

      - name: Update latest data file for Vercel deployment
        run: |
          LATEST_DATA=$(ls public/data/etoro-data-*.json 2>/dev/null | sort -r | head -n 1)
          if [ -z "$LATEST_DATA" ]; then
            echo "⚠️  No data files found to update census-data-latest.json"
            exit 0
          fi

          # Coverage gate — matches COVERAGE_THRESHOLD = 0.95 in analysis/lib/utils.ts
          COVERAGE=$(node -e "
            const data = JSON.parse(require('fs').readFileSync('$LATEST_DATA', 'utf8'));
            const slice = data.investors.slice(0, 1500);
            const withPortfolio = slice.filter(i => i.portfolio?.positions?.length > 0).length;
            const coverage = slice.length > 0 ? withPortfolio / slice.length : 0;
            console.log(JSON.stringify({ pct: Math.round(coverage * 1000) / 10, with: withPortfolio, total: slice.length }));
          ")
          echo "📊 Portfolio coverage: $COVERAGE"

          PASS=$(echo "$COVERAGE" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); process.exit(d.pct >= 95 ? 0 : 1)" && echo "true" || echo "false")

          if [ "$PASS" = "true" ]; then
            cp "$LATEST_DATA" public/data/census-data-latest.json
            echo "✅ Updated census-data-latest.json (coverage ≥95%)"
          else
            echo "⚠️  SKIPPED: Portfolio coverage below 95% — keeping previous census-data-latest.json"
            echo "This run's data is archived but NOT published as latest"
          fi

      - name: Commit dated files to data-archive branch
        run: |
          echo "📦 Archiving census data to permanent storage..."

          # Fetch data-archive branch
          git fetch origin data-archive:data-archive

          # Create worktree for data-archive
          git worktree add archive data-archive
          cd archive

          # Disable sparse-checkout in this worktree (we want all files)
          git sparse-checkout disable

          # Copy new dated files from this run
          echo "Copying dated files to archive..."
          cp ../public/data/etoro-data-*.json data/ 2>/dev/null || true
          cp ../public/reports/etoro-census-*.html reports/ 2>/dev/null || true

          # Add files to git (use --sparse for compatibility)
          git add --sparse data/*.json reports/*.html

          # Commit if there are new files
          if git diff --staged --quiet; then
            echo "⚠️  No new files to archive (might be a re-run)"
          else
            # Count new files
            NEW_JSON=$(git diff --staged --name-only | grep "data/.*\.json" | wc -l)
            NEW_HTML=$(git diff --staged --name-only | grep "reports/.*\.html" | wc -l)

            COMMIT_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')
            git commit -m "Archive census data - $COMMIT_DATE

          Added $NEW_JSON JSON file(s) and $NEW_HTML HTML report(s)

          Auto-committed by daily census workflow"

            # Pull with rebase to handle any concurrent pushes, then push with retry
            for i in 1 2 3; do
              echo "Push attempt $i..."
              git pull --rebase origin data-archive && git push origin data-archive && break
              echo "Attempt $i failed, retrying in 5 seconds..."
              sleep 5
            done
            echo "✅ Successfully archived $NEW_JSON JSON and $NEW_HTML HTML files to data-archive branch"
            echo "📊 Total files in archive: $(ls data/*.json 2>/dev/null | wc -l) JSON, $(ls reports/*.html 2>/dev/null | wc -l) HTML"
          fi

          cd ..
          git worktree remove archive

      - name: Compress old data files
        run: |
          echo "🗜️ Compressing data files older than 7 days..."
          if [ -f "scripts/compress-historical-data.js" ]; then
            node scripts/compress-historical-data.js
            echo "✅ Data compression complete"
          else
            echo "⚠️  Compression script not found (first run?), skipping"
          fi

      - name: Commit and push reports with deployment trigger
        run: |
          # Only commit census-data-latest.json (keeps repo small)
          # Dated files are stored in workflow artifacts for GitHub Pages
          # Use --sparse flag for sparse-checkout compatibility
          git add --sparse public/data/census-data-latest.json

          # Add deployment trigger file
          echo "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" > .github/last-deployment-trigger
          git add --sparse .github/last-deployment-trigger

          # Commit everything together if there are changes
          git diff --staged --quiet || {
            COMMIT_MSG="Daily census report - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git commit -m "$COMMIT_MSG"

            # Pull with rebase to handle any concurrent pushes, then push with retry
            for i in 1 2 3; do
              echo "Push attempt $i..."
              git pull --rebase origin master && git push && break
              echo "Attempt $i failed, retrying in 5 seconds..."
              sleep 5
            done
            echo "✅ Reports committed and pushed - this should trigger GitHub Pages deployment automatically"
          }

      - name: Upload reports and data as artifacts for GitHub Pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: census-reports
          path: |
            public/reports/etoro-census-*.html
            public/data/etoro-data-*.json
          retention-days: 30

      - name: Trigger GitHub Pages deployment
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Trigger the deploy-pages workflow
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'master'
            });
            console.log('✅ Triggered GitHub Pages deployment workflow');

      - name: Trigger Vercel deployment
        if: success()
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "🚀 Triggering Vercel deployment..."
            curl -X POST "$VERCEL_DEPLOY_HOOK" \
              -H "Content-Type: application/json" \
              && echo "✅ Vercel deployment triggered successfully" \
              || echo "⚠️  Vercel deploy hook failed (non-fatal)"
          else
            echo "⚠️  VERCEL_DEPLOY_HOOK secret not configured, skipping Vercel deployment"
            echo "ℹ️  Add the webhook URL to GitHub Secrets to enable automatic Vercel deployments"
          fi

  # Failure notification job - runs if the main job fails
  notify-failure:
    runs-on: ubuntu-latest
    needs: generate-report
    if: failure()
    permissions:
      issues: write

    steps:
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().split('T')[0];

            // Check for existing open issues with the same title
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'census-failure,automated'
            });

            // Don't create duplicate issues
            const existingIssue = issues.find(issue =>
              issue.title.includes('Daily Census Failed')
            );

            if (existingIssue) {
              // Add a comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## ⚠️ Another failure occurred\n\n**Date**: ${date}\n**Run**: ${runUrl}\n\nThe daily census workflow failed again. Please investigate.`
              });
              console.log(`Added comment to existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Daily Census Failed - ${date}`,
                body: `## Daily Census Report Generation Failed\n\n**Date**: ${date}\n**Workflow Run**: ${runUrl}\n\n### What happened?\nThe automated daily census report generation failed. This means today's census data was not collected.\n\n### Next Steps\n1. Check the [workflow run logs](${runUrl}) for error details\n2. Common issues:\n   - eToro API rate limiting\n   - API key expiration\n   - Memory issues during data collection\n   - Network timeouts\n3. Manually trigger the workflow once the issue is resolved\n\n### Impact\n- No census data for ${date}\n- Historical trends may have gaps\n\n---\n*This issue was automatically created by the census failure alerting system.*`,
                labels: ['census-failure', 'automated', 'bug']
              });
              console.log(`Created issue #${issue.data.number}`);
            }

      - name: Send Slack notification (if configured)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification"
            exit 0
          fi
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d '{
              "text": "🚨 Daily Census Failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🚨 Daily Census Report Generation Failed*\n\nThe automated census workflow encountered an error."
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ github.workflow }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Run ID:*\n${{ github.run_id }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow Run"
                      },
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }' || echo "Slack notification failed (non-fatal)"

