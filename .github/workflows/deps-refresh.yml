name: Monthly Dependency Refresh
'on':
  schedule:
    - cron: '13 5 8 * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    uses: weirdapps/shared-workflows/.github/workflows/deps-refresh.yml@main
    with:
      node_version: '22'
      gate_cmd: NODE_OPTIONS='--max-old-space-size=4096' npm run lint && npx tsc --noEmit && npm test -- --run && npm run build
    secrets: inherit
