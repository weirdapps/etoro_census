name: Migrate Historical Data to Archive Branch

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove large unnecessary packages to free up ~10GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          echo "Disk space after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"

      - name: Download all existing artifacts from daily census runs
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: daily-census.yml
          name: census-reports
          path: temp-archive
          search_artifacts: true
          skip_unpack: false
          if_no_artifact_found: warn

      - name: Count downloaded artifacts
        id: count
        run: |
          JSON_COUNT=$(find temp-archive -name "etoro-data-*.json" 2>/dev/null | wc -l)
          HTML_COUNT=$(find temp-archive -name "etoro-census-*.html" 2>/dev/null | wc -l)
          echo "json_count=$JSON_COUNT" >> $GITHUB_OUTPUT
          echo "html_count=$HTML_COUNT" >> $GITHUB_OUTPUT
          echo "📊 Found $JSON_COUNT JSON files and $HTML_COUNT HTML files in artifacts"

      - name: Checkout data-archive branch
        run: |
          echo "Fetching data-archive branch..."
          git fetch origin data-archive:data-archive

          echo "Creating worktree for data-archive branch..."
          git worktree add archive data-archive

          echo "✅ Data-archive worktree ready"

      - name: Copy all historical files to archive branch
        run: |
          echo "Copying files from artifacts to archive branch..."

          # Copy all JSON data files
          if [ -d "temp-archive" ]; then
            find temp-archive -name "etoro-data-*.json" -type f -exec cp {} archive/data/ \; 2>/dev/null || true
            find temp-archive -name "etoro-census-*.html" -type f -exec cp {} archive/reports/ \; 2>/dev/null || true
          fi

          # Count what we copied
          DATA_COUNT=$(ls archive/data/*.json 2>/dev/null | wc -l)
          REPORT_COUNT=$(ls archive/reports/*.html 2>/dev/null | wc -l)

          echo "📁 Copied to archive branch:"
          echo "   - $DATA_COUNT JSON data files"
          echo "   - $REPORT_COUNT HTML reports"

      - name: Commit and push to data-archive branch
        run: |
          cd archive

          # Add all data files
          git add data/*.json reports/*.html 2>/dev/null || true

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "⚠️  No files to commit (archive might already contain all data)"
          else
            # Count files being committed
            NEW_JSON=$(git diff --staged --name-only | grep "data/.*\.json" | wc -l)
            NEW_HTML=$(git diff --staged --name-only | grep "reports/.*\.html" | wc -l)

            echo "📝 Committing $NEW_JSON JSON files and $NEW_HTML HTML files..."

            git commit -m "Migrate all historical census data from artifacts

          This migration includes:
          - $NEW_JSON JSON data files
          - $NEW_HTML HTML reports

          Source: GitHub Actions artifacts from daily-census workflow
          Migration date: $(date -u +'%Y-%m-%d %H:%M UTC')"

            echo "⬆️  Pushing to data-archive branch..."
            git push origin data-archive

            echo "✅ Successfully migrated all historical data!"
            echo "📊 Archive branch now contains:"
            echo "   - $(ls data/*.json 2>/dev/null | wc -l) total JSON files"
            echo "   - $(ls reports/*.html 2>/dev/null | wc -l) total HTML files"
          fi

      - name: Cleanup
        if: always()
        run: |
          cd ..
          git worktree remove archive --force || true
          rm -rf temp-archive

      - name: Summary
        run: |
          echo "🎉 Migration complete!"
          echo ""
          echo "Next steps:"
          echo "  1. Run local sync script to download: ./scripts/sync-data-archive.sh"
          echo "  2. Daily census will now auto-commit to data-archive branch"
          echo "  3. Local LaunchAgent will auto-sync at 3 AM daily"
          echo ""
          echo "To verify:"
          echo "  git fetch origin data-archive"
          echo "  git worktree add archive data-archive"
          echo "  ls archive/data/*.json | wc -l"
