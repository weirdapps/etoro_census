<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk vs Return Analysis</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8fafc;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .title {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 16px;
            color: #64748b;
        }
        .chart-container {
            margin: 24px 0;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #475569;
        }
        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }
        .stat-card {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #00C896;
        }
        .stat-label {
            font-size: 14px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { ComposedChart, Scatter, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell } = Recharts;

        // Sample data - replace with actual data from your analysis
        const sampleData = [
            { x: 4.2, y: 8.5, username: 'thomaspj', copiers: 40000, highlighted: false },
            { x: 5.0, y: 7.6, username: 'JeppeKirkBonde', copiers: 29000, highlighted: false },
            { x: 4.8, y: 6.2, username: 'aukie', copiers: 15000, highlighted: false },
            { x: 5.2, y: 5.8, username: 'smud', copiers: 12000, highlighted: false },
            { x: 4.6, y: 4.9, username: 'saifsyn', copiers: 8000, highlighted: false },
            { x: 4.5, y: 8.2, username: 'menago76', copiers: 5000, highlighted: true }, // Purple dot
            { x: 3.8, y: 3.2, username: 'investor1', copiers: 3000, highlighted: false },
            { x: 5.8, y: 9.1, username: 'investor2', copiers: 2500, highlighted: false },
            { x: 6.2, y: 1.8, username: 'investor3', copiers: 2000, highlighted: false },
            { x: 3.5, y: 5.5, username: 'investor4', copiers: 1800, highlighted: false },
        ];

        // Efficient frontier curve data
        const efficientFrontier = [
            { x: 4.0, y: 2.5 },
            { x: 4.2, y: 4.8 },
            { x: 4.5, y: 6.5 },
            { x: 5.0, y: 7.8 },
            { x: 5.5, y: 8.5 },
            { x: 6.0, y: 8.9 },
            { x: 6.5, y: 9.1 },
            { x: 7.0, y: 9.2 }
        ];

        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                const data = payload[0].payload;
                return (
                    <div style={{
                        background: 'white',
                        border: '1px solid #e2e8f0',
                        borderRadius: '8px',
                        padding: '12px',
                        boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)'
                    }}>
                        <p style={{ margin: 0, fontWeight: 600, color: '#1e293b' }}>
                            @{data.username}
                        </p>
                        <p style={{ margin: '4px 0 0', fontSize: '14px', color: '#64748b' }}>
                            Risk: {data.x} | Return: {data.y}%
                        </p>
                        <p style={{ margin: '4px 0 0', fontSize: '14px', color: '#64748b' }}>
                            Copiers: {data.copiers?.toLocaleString()}
                        </p>
                    </div>
                );
            }
            return null;
        };

        const RiskReturnChart = () => {
            const [selectedInvestors] = useState(['menago76']);

            const getPointColor = (entry) => {
                if (entry.highlighted || selectedInvestors.includes(entry.username)) {
                    return '#9333ea'; // Purple for highlighted
                }
                return '#00C896'; // eToro green for others
            };

            const getPointSize = (entry) => {
                if (entry.highlighted || selectedInvestors.includes(entry.username)) {
                    return 80; // Larger for highlighted
                }
                return Math.max(20, Math.min(60, entry.copiers / 1000));
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1 className="title">Risk vs Return Analysis</h1>
                        <p className="subtitle">eToro Popular Investors with @menago76 highlighted</p>
                    </div>

                    <div className="chart-container">
                        <ResponsiveContainer width="100%" height={600}>
                            <ComposedChart
                                data={sampleData}
                                margin={{ top: 20, right: 30, left: 20, bottom: 60 }}
                            >
                                <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                                <XAxis 
                                    type="number" 
                                    dataKey="x" 
                                    domain={[4, 7]}
                                    tickCount={4}
                                    label={{ value: 'Average Risk Score', position: 'insideBottom', offset: -5 }}
                                />
                                <YAxis 
                                    type="number" 
                                    dataKey="y" 
                                    domain={[0, 12]}
                                    label={{ value: 'Period Return (%)', angle: -90, position: 'insideLeft' }}
                                />
                                <Tooltip content={<CustomTooltip />} />
                                
                                {/* Efficient Frontier */}
                                <Line 
                                    data={efficientFrontier} 
                                    type="monotone" 
                                    dataKey="y" 
                                    stroke="#94a3b8" 
                                    strokeWidth={2}
                                    strokeDasharray="5 5"
                                    dot={false}
                                    connectNulls={false}
                                />
                                
                                {/* Scatter points */}
                                <Scatter dataKey="y" fill="#00C896">
                                    {sampleData.map((entry, index) => (
                                        <Cell 
                                            key={`cell-${index}`} 
                                            fill={getPointColor(entry)}
                                            r={getPointSize(entry) / 10}
                                        />
                                    ))}
                                </Scatter>
                            </ComposedChart>
                        </ResponsiveContainer>
                    </div>

                    <div className="legend">
                        <div className="legend-item">
                            <div className="legend-dot" style={{ background: '#00C896' }}></div>
                            <span>Regular Investors</span>
                        </div>
                        <div className="legend-item">
                            <div className="legend-dot" style={{ background: '#9333ea' }}></div>
                            <span>@menago76 (Highlighted)</span>
                        </div>
                        <div className="legend-item">
                            <div style={{ width: '20px', height: '2px', background: '#94a3b8', borderStyle: 'dashed' }}></div>
                            <span>Efficient Frontier</span>
                        </div>
                    </div>

                    <div className="stats">
                        <div className="stat-card">
                            <div className="stat-value">10</div>
                            <div className="stat-label">Total Investors</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-value">4.0 - 7.0</div>
                            <div className="stat-label">Risk Range</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-value">1.8% - 9.1%</div>
                            <div className="stat-label">Return Range</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-value">@menago76</div>
                            <div className="stat-label">Highlighted (Purple)</div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<RiskReturnChart />, document.getElementById('root'));
    </script>
</body>
</html>
