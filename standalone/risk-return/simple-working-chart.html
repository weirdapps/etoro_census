        // Generate smooth efficient frontier using mathematical formula
        // Square root formula: y = a * sqrt(x - b)
        // Calibrated to start at (1, 0) and end at (7, 20)
        const generateEfficientFrontier = () => {
            const points = [];
            
            // Two point calibration: (1, 0) and (7, 20)
            // 0 = a * sqrt(1 - 1) = 0 (satisfied for any a)
            // 20 = a * sqrt(7 - 1) = a * sqrt(6)
            // Therefore: a = 20 / sqrt(6) ≈ 8.165
            
            const a = 20 / Math.sqrt(6);  // ≈ 8.165
            const b = 1;  // x-offset (start point)
            
            // Generate very smooth curve with fine increments
            // Formula: y = 8.165 * sqrt(x - 1)
            for (let x = 1.0; x <= 7; x += 0.02) {
                const y = a * Math.sqrt(x - b);
                points.push({ x: parseFloat(x.toFixed(2)), y: parseFloat(y.toFixed(2)) });
            }
            return points;
        };
        
        const efficientFrontier = generateEfficientFrontier();

                            const y = point.y + position.offsetY;

                            ctx.fillStyle = '#374151';
                            ctx.font = 'bold 11px system-ui';
                            ctx.textAlign = position.align;
                            ctx.fillText(investor.label, x, y);
                            ctx.restore();
                        }
                    });
