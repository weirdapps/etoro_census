        .investor-label {

            font-size: 10px;
            font-weight: 600;

        }
        .stats {

            margin-top: 24px;

        .stat-card {

    <script>
        // Simple tooltip functionality
        const tooltip = document.getElementById('tooltip');
        const circles = document.querySelectorAll('circle[data-tooltip]');

        circles.forEach(circle => {
            circle.addEventListener('mouseenter', (e) => {
                const data = e.target.getAttribute('data-tooltip').split('|');
                tooltip.innerHTML = `
                    <div style="font-weight: 600; color: #1e293b;">${data[0]}</div>
                    <div style="color: #64748b; margin-top: 4px;">${data[1]}</div>
                    <div style="color: #64748b; margin-top: 4px;">${data[2]}</div>
                    <div style="color: #64748b; margin-top: 4px;">${data[3]}</div>
                `;
                tooltip.style.opacity = '1';
            });

            circle.addEventListener('mousemove', (e) => {
                tooltip.style.left = (e.pageX + 10) + 'px';
                tooltip.style.top = (e.pageY - 10) + 'px';
            });

            circle.addEventListener('mouseleave', () => {
                tooltip.style.opacity = '0';
            });
        });
    </script>
</body>
</html>
