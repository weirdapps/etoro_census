# SonarCloud configuration for TypeScript/JavaScript projects

sonar.organization=weirdapps
sonar.projectKey=weirdapps_etoro_census
sonar.projectName=etoro_census

# Source code location
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Test coverage (if using jest/vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.spec.js,\
  **/*.test.js,\
  **/coverage/**,\
  **/.vite/**,\
  **/.next/**

# Test exclusions
sonar.test.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.spec.js,\
  **/*.test.js
