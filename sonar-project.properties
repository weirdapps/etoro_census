# SonarCloud configuration for TypeScript/JavaScript projects

sonar.organization=weirdapps
sonar.projectKey=weirdapps_etoro_census
sonar.projectName=etoro_census

# Source code location
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Test coverage (if using jest/vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
#
# The generated census output is committed, and it is enormous:
# public/data/latest-census.json alone is ~2.7M lines, data/*.json another ~7M,
# public/reports/index.html ~485k. Sonar skips the oversized ones on file size,
# but the smaller generated HTML and JSON still billed as source, and the org
# is on the 50k-LOC free plan. analysis/ and research/ are one-off scripts and
# their chart output, not product source. None of it is code we maintain.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.spec.js,\
  **/*.test.js,\
  **/coverage/**,\
  **/.vite/**,\
  **/.next/**,\
  data/**,\
  public/**,\
  analysis/**,\
  research/**,\
  supabase/migrations/**

# Test exclusions
sonar.test.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.spec.js,\
  **/*.test.js
