# SonarCloud Configuration
# https://sonarcloud.io

sonar.projectKey=weirdapps_etoro_census
sonar.organization=weirdapps

# Project metadata
sonar.projectName=eToro Census
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=src,analysis
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.test.tsx,**/__tests__/**,.next/**,coverage/**,public/**

# TypeScript/JavaScript configuration
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true
