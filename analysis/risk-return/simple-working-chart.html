            { x: 3.25, y: 11.17, name: 'Slow_and_Steady', copiers: 793 },
        ];

        // Generate smooth efficient frontier using mathematical formula
        // Square root formula: y = a * sqrt(x)
        // Calibrated to start at (0, 0) and pass between key investors:
        // - Above: @thomaspj (4.39, 25.48), @JeppeKirkBonde (4.29, 23.74)
        // - Below: @davoyu (4.39, 31.32), @Kevin_Pando (4.87, 33.85)
        const generateEfficientFrontier = () => {
            const points = [];

            // Calibration: at x=4.3, y ≈ 28 (above ~25%, below ~31%)
            // 28 = a * sqrt(4.3)
            // a = 28 / sqrt(4.3) ≈ 13.5

            const a = 13.5;

            // Generate very smooth curve with fine increments
            // Formula: y = 13.5 * sqrt(x)
            for (let x = 0; x <= 6.0; x += 0.02) {
                const y = a * Math.sqrt(x);
                points.push({ x: parseFloat(x.toFixed(2)), y: parseFloat(y.toFixed(2)) });
            }
            return points;
        };
        
        const efficientFrontier = generateEfficientFrontier();

        const ctx = document.getElementById('riskReturnChart').getContext('2d');
        
        const chart = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [

                        label: 'Popular Investors',
                        data: topInvestors.map(inv => ({
                            x: inv.x,
                            y: inv.y,
                            name: inv.name,
                            copiers: inv.copiers
                        })),
                        backgroundColor: function(context) {

                            return point.y >= 0 ? '#00C896' : '#ef4444';
                        },
                        borderColor: function(context) {
                            const point = context.parsed;
                            return point.y >= 0 ? '#00A678' : '#dc2626';
                        },
                        pointRadius: function(context) {
                            const copiers = topInvestors[context.dataIndex].copiers;
                            return Math.max(4, Math.min(12, copiers / 3000));
                        }

                        label: 'Efficient Frontier',
                        data: efficientFrontier,
                        type: 'line',
                        borderColor: '#9333ea',
                        backgroundColor: 'transparent',
                        borderWidth: 3,
                        pointRadius: 0,
                        fill: false,
                        tension: 0,
                        spanGaps: true,
                        stepped: false
                    }

            },
            plugins: [{
                id: 'customLabels',
                afterDraw: function(chart) {
                    const ctx = chart.ctx;
                    const topPerformers = topInvestors.filter(inv => inv.label);
                    
                    // Smart positioning to avoid overlaps
                    const labelPositions = {
                        '@hugo13250': { offsetX: 0, offsetY: -15, align: 'center' },
                        '@MercedesSotelo': { offsetX: 15, offsetY: -5, align: 'left' },
                        '@Flaten': { offsetX: -15, offsetY: -5, align: 'right' },

                        '@thomaspj': { offsetX: 15, offsetY: 5, align: 'left' },
                        '@JeppeKirkBonde': { offsetX: -15, offsetY: -5, align: 'right' }
                    };
                    
                    topPerformers.forEach(investor => {
                        const meta = chart.getDatasetMeta(0);
                        const index = topInvestors.findIndex(inv => inv.name === investor.name);
                        if (index !== -1 && meta.data[index]) {
                            const point = meta.data[index];
                            const position = labelPositions[investor.label] || { offsetX: 0, offsetY: -15, align: 'center' };
                            
                            const x = point.x + position.offsetX;
                            const y = point.y + position.offsetY;
                            
                            ctx.save();
                            ctx.fillStyle = '#374151';
                            ctx.font = 'bold 11px system-ui';
                            ctx.textAlign = position.align;
                            ctx.fillText(investor.label, x, y);
                            ctx.restore();
                        }
                    });
                }

                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: false
                    },
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            title: function(context) {
                                const point = context[0];
                                const investor = topInvestors[point.dataIndex];
                                return '@' + investor.name;
                            },
                            label: function(context) {

                                return [

                                    `Period Return: ${context.parsed.y}%`,
